name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Corepack otherwise prompts before downloading the pinned pnpm.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      # The build never sends mail, but src/lib/env.ts is imported by the
      # contact route and these keep the shape honest if that ever changes.
      CONTACT_TO_EMAIL: ci@example.com
      NEXT_PUBLIC_SITE_URL: https://ci.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
